<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamified Scripts</title>
<style>
:root{
  --bg:#0e1124; --panel:#181d3a; --panel2:#212850; --line:#2f376b; --text:#eef0ff; --muted:#9aa3d6;
  --accent:#7c5cff; --accent2:#22d3ee; --good:#34d399; --bad:#fb7185; --radius:14px;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#1d2260 0%,transparent 60%),var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:1100px;margin:0 auto;padding:24px 20px 80px}
h1,h2,h3{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--panel2);transition:.15s}
button:hover:not(:disabled){filter:brightness(1.2)}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--accent),#5b8cff);font-weight:600}
.ghost{background:transparent;border:1px solid var(--line)}
.danger{color:var(--bad)}
.big{padding:14px 28px;font-size:18px;border-radius:12px}
input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.topbar .grow{flex:1}
.muted{color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.badge.done{background:#12382d;color:var(--good)} .badge.prog{background:#3a3010;color:#fbbf24}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:18px}
.panel h3{font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}

/* home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:19px}
.card .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}
.card .row button{padding:8px 12px;font-size:14px}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty .emoji{font-size:54px}

/* editor */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mode{text-align:left;padding:14px;border:2px solid var(--line);background:var(--bg);border-radius:12px}
.mode.on{border-color:var(--accent);background:#1c2150}
.mode .ic{font-size:26px} .mode b{display:block;margin-top:4px} .mode span{font-size:13px;color:var(--muted)}
.items-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.items-row .n{width:26px;text-align:right;color:var(--muted);font-size:13px}
.items-row input{flex:1}
.items-row textarea{flex:1}
.script-sec{margin-bottom:18px}
.script-sec h4{margin:0 0 10px;font-size:16px}
.star{padding:8px 11px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.star.on{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.12)}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(440px,100vw);background:var(--panel);border-left:1px solid var(--line);
  padding:18px;overflow:auto;transform:translateX(105%);transition:.25s;z-index:20;box-shadow:-10px 0 40px rgba(0,0,0,.4)}
#drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.scriptres{margin:0 0 18px}
.scriptres .res{font-size:17px;padding:10px 16px}
.scriptres h4{margin:0 0 8px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.res .tag{font-size:20px;width:54px;text-align:center}
.items-row button{padding:8px 11px}
.addbox{display:flex;gap:8px;align-items:flex-start;margin-bottom:14px}
.tier-edit{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.tier-edit input[type=color]{width:42px;height:40px;padding:0;border:0;background:none;cursor:pointer}
.tier-edit input[type=text]{max-width:200px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}

/* play */
.hint{color:var(--muted);font-size:14px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:grab;user-select:none;font-weight:500;display:inline-block}
.chip.sel{outline:3px solid var(--accent2)}
.chip.dragging{opacity:.4}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:64px;padding:14px;border:2px dashed var(--line);border-radius:var(--radius);background:rgba(255,255,255,.02)}
.over{border-color:var(--accent2)!important;background:rgba(34,211,238,.08)!important}
.rank-layout{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:22px;align-items:start}
.pool.col{flex-direction:column;flex-wrap:nowrap}
.pool.col .chip{display:block}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:8px 12px;min-height:58px}
.slot .num{font-size:24px;font-weight:800;width:44px;text-align:center;color:var(--accent2)}
.slot .chip{flex:1;display:block}
.slot .ph{color:var(--muted);font-size:14px}
.slot.filled{border-style:solid}
.tiers{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.tier{display:flex;min-height:78px;background:var(--panel);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.tier-label{width:86px;min-width:86px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#111;text-align:center;padding:6px;word-break:break-word}
.tier-items{flex:1;display:flex;flex-wrap:wrap;gap:8px;padding:10px;align-content:flex-start;border:2px solid transparent}
.finish{margin-top:22px;display:flex;gap:12px;justify-content:flex-end;align-items:center}

/* versus */
.progress{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden;margin:6px 0 30px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
.vs-card{min-height:260px;font-size:clamp(22px,3.4vw,38px);font-weight:700;padding:30px;border-radius:20px;background:var(--panel);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word}
.vs-card:hover{border-color:var(--accent2);transform:translateY(-4px);background:var(--panel2)}
.vs-or{font-size:20px;font-weight:800;color:var(--muted)}
.center{text-align:center}
.rate-item{text-align:center;font-size:clamp(28px,5vw,56px);font-weight:800;padding:60px 24px;margin:10px 0 28px;border-radius:24px;
  background:var(--panel);border:2px solid var(--line);word-break:break-word}
.rate-btns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rate-btns button{font-size:clamp(20px,3vw,32px);font-weight:700;padding:30px 20px;border-radius:18px;border:2px solid transparent}
.rate-btns .over{background:#4a1f2a;border-color:var(--bad);color:#ffd5db}
.rate-btns .under{background:#123d33;border-color:var(--good);color:#c9f7e6}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.col2 h3{text-align:center;font-size:22px;margin-bottom:10px}
.col2 .over h3{color:var(--bad)} .col2 .under h3{color:var(--good)}
.col2 .chip{display:block;margin-bottom:8px;cursor:default;font-size:17px}
.col2>div{background:var(--panel);border-radius:14px;padding:16px;border:1px solid var(--line)}
@media(max-width:760px){.rate-btns,.col2{grid-template-columns:1fr}}

/* results */
.podium{display:flex;flex-direction:column;gap:10px}
.res{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-size:18px}
.res .n{font-size:24px;font-weight:800;width:54px;text-align:center;color:var(--accent2)}
.res.r1{background:linear-gradient(90deg,#4a3a05,var(--panel));border-color:#fbbf24;font-size:26px;padding:18px}
.res.r2{background:linear-gradient(90deg,#33384a,var(--panel));border-color:#cbd5e1;font-size:22px}
.res.r3{background:linear-gradient(90deg,#4a2c15,var(--panel));border-color:#d6894f;font-size:20px}
.res.r1 .n,.res.r2 .n,.res.r3 .n{font-size:30px}
.res.un{opacity:.65}
.tier .chip{cursor:default;font-size:17px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--panel2);border:1px solid var(--line);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}
#toast.show{transform:translateX(-50%);opacity:1}
@media(max-width:760px){
  .rank-layout{grid-template-columns:1fr}
  .vs{grid-template-columns:1fr}.vs-or{text-align:center}.vs-card{min-height:140px}
  .tier-label{width:60px;min-width:60px;font-size:20px}
}
</style>
</head>
<body>
<div id="app"></div>
<aside id="drawer"></aside>
<div id="toast"></div>
<script>
'use strict';
const KEY = 'gamified-scripts-v1';
const MODES = {
  rank:   { label: 'Ranking',     icon: '🔢', desc: 'Put items in order, 1 to 10, 1 to 15… any length.' },
  tier:   { label: 'Tier List',   icon: '🏅', desc: 'Drop items into S, A, B, C… tiers.' },
  versus: { label: 'This or That', icon: '⚔️', desc: 'Pick a winner head-to-head until a full ranking appears.' },
  rated:  { label: 'Overrated / Underrated', icon: '📈', desc: 'One item at a time: is it overrated or underrated?' }
};
const DEFAULT_TIERS = [['S','#ff7f7f'],['A','#ffbf7f'],['B','#ffdf7f'],['C','#ffff7f'],['D','#bfff7f']];

const $app = document.getElementById('app');
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let games = [];
try { games = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { games = []; }
games.forEach(g => { g.hooks = g.hooks || []; g.closings = g.closings || []; });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(games)); } catch (e) { toast('Could not save (storage full or blocked)'); } };
const touch = g => { g.updatedAt = Date.now(); save(); };

let scriptOpen = false, curId = null, editingId = null, view = 'home', sel = null, dragId = null;
const cur = () => games.find(g => g.id === curId);
const nameOf = g => g.name.trim() || 'Untitled game';
const status = g => g.result ? 'done' : g.session ? 'prog' : 'draft';
const itemById = (g, id) => g.items.find(i => i.id === id) || { id, text: '(removed item)' };
const mkTiers = () => DEFAULT_TIERS.map(([name, color]) => ({ id: uid(), name, color }));

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- routing ---------- */
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener('hashchange', route);

function route() {
  if (editingId) {
    const g = games.find(x => x.id === editingId);
    if (g && !g.name.trim() && !g.items.length) { games = games.filter(x => x !== g); save(); }
    editingId = null;
  }
  const [, page, id] = location.hash.split('/');
  const g = games.find(x => x.id === id);
  curId = g ? g.id : null; sel = null; scriptOpen = false; syncDrawer();
  if (page === 'edit' && g) return renderEditor(g);
  if (page === 'play' && g) { if (!g.session) startSession(g); return renderPlay(g); }
  if (page === 'results' && g && g.result) return renderResults(g);
  renderHome();
}

/* ---------- video script (hooks & closing lines) ---------- */
const KIND_LABEL = { hooks: 'Hook', closings: 'Closing line' };
function scriptHTML(g) {
  const sec = (kind, title, ph) => `<div class="script-sec"><h4>${title}</h4>
    ${g[kind].map(x => `<div class="items-row">
      <button class="star ${x.pick ? 'on' : ''}" data-act="starScript" data-kind="${kind}" data-id="${x.id}" title="Mark as the one you'll use">★</button>
      <textarea rows="2" data-in="script" data-kind="${kind}" data-id="${x.id}">${esc(x.text)}</textarea>
      <button class="ghost danger" data-act="delScript" data-kind="${kind}" data-id="${x.id}">✕</button></div>`).join('') || '<div class="hint" style="margin-bottom:8px">None yet.</div>'}
    <div class="addbox"><textarea class="addScript" data-kind="${kind}" rows="2" placeholder="${ph}"></textarea>
      <button class="primary" data-act="addScript" data-kind="${kind}">Add</button></div></div>`;
  return sec('hooks', '🎣 Hook options', 'Type a hook option, press Enter to add…') +
         sec('closings', '🎬 Closing line options', 'Type a closing line, press Enter to add…');
}
function refreshScript() {
  const g = cur(); if (!g) return;
  document.querySelectorAll('.scriptBox').forEach(el => { el.innerHTML = scriptHTML(g); });
}
function syncDrawer() {
  const d = document.getElementById('drawer'), g = cur();
  d.classList.toggle('open', scriptOpen);
  d.innerHTML = scriptOpen && g ? `<div class="drawer-head"><h3>✍️ Video script</h3>
    <button class="ghost" data-act="toggleScript">Close</button></div><div class="scriptBox">${scriptHTML(g)}</div>` : '';
}
function addScript(kind) {
  const g = cur(), ta = [...document.querySelectorAll(`.addScript[data-kind="${kind}"]`)].find(t => t.offsetParent);
  if (!ta) return;
  const lines = ta.value.split('\n').map(x => x.trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(text => g[kind].push({ id: uid(), text, pick: false }));
  touch(g); refreshScript();
  [...document.querySelectorAll(`.addScript[data-kind="${kind}"]`)].find(t => t.offsetParent)?.focus();
  if (view === 'results') renderResults(g);
}
function scriptResultHTML(g, kind, title) {
  const list = g[kind]; if (!list.length) return '';
  return `<div class="scriptres"><h4>${title}</h4>${list.map(x => `<div class="res ${x.pick ? 'r1' : ''}">
    <div class="tag">${x.pick ? '⭐' : '•'}</div>${esc(x.text)}</div>`).join('')}</div>`;
}

/* ---------- home ---------- */
function renderHome() {
  view = 'home';
  const sorted = games.slice().sort((a, b) => b.updatedAt - a.updatedAt);
  $app.innerHTML = `
    <div class="topbar">
      <div class="grow"><h1>🎮 Gamified Scripts</h1><div class="muted">Interactive ranking games to play live with your clients.</div></div>
      <button class="ghost" data-act="export">Export backup</button>
      <button class="ghost" data-act="import">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
      <button class="primary big" data-act="new">+ New game</button>
    </div>
    ${sorted.length ? `<div class="grid">${sorted.map(g => {
      const st = status(g);
      return `<div class="card">
        <div><span class="badge">${MODES[g.mode].icon} ${MODES[g.mode].label}</span>
          <span class="badge ${st}">${{done:'Completed',prog:'In progress',draft:'Draft'}[st]}</span></div>
        <h3>${esc(nameOf(g))}</h3>
        <div class="muted">${g.items.length} item${g.items.length === 1 ? '' : 's'}</div>
        <div class="row">
          ${st === 'done' ? `<button class="primary" data-act="open-results" data-id="${g.id}">View result</button>
                             <button data-act="replay" data-id="${g.id}">Play again</button>` :
            st === 'prog' ? `<button class="primary" data-act="open-play" data-id="${g.id}">Resume</button>` :
                            `<button class="primary" data-act="open-play" data-id="${g.id}" ${g.items.length < 2 ? 'disabled' : ''}>Start</button>`}
          <button data-act="open-edit" data-id="${g.id}">Edit</button>
          <button data-act="dup" data-id="${g.id}">Duplicate</button>
          <button class="danger ghost" data-act="del" data-id="${g.id}">Delete</button>
        </div></div>`;
    }).join('')}</div>` : `<div class="empty"><div class="emoji">🎲</div><h2>No games yet</h2>
      <p>Create a ranking, tier list or this-or-that game to play with a client.</p></div>`}`;
}

/* ---------- editor ---------- */
function renderEditor(g) {
  view = 'edit'; editingId = g.id;
  $app.innerHTML = `
    <div class="topbar">
      <button class="ghost" data-act="home">← All games</button>
      <div class="grow"></div>
      <button class="primary big" id="startBtn" data-act="start">▶ Start game</button>
    </div>
    <div class="panel"><h3>1 · Name</h3>
      <input type="text" data-in="name" placeholder="e.g. Brand priorities, Favorite hooks, Content pillars…" value="${esc(g.name)}"></div>
    <div class="panel"><h3>2 · Game mode</h3>
      <div class="modes">${Object.entries(MODES).map(([k, m]) => `
        <button class="mode ${g.mode === k ? 'on' : ''}" data-act="setMode" data-mode="${k}">
          <div class="ic">${m.icon}</div><b>${m.label}</b><span>${m.desc}</span></button>`).join('')}</div></div>
    <div class="panel"><h3>3 · Items <span id="itemCount" class="muted"></span></h3>
      <div class="addbox"><textarea id="newItems" rows="2" placeholder="Type an item and press Enter. Paste a list to add one item per line."></textarea>
        <button class="primary" data-act="addItems">Add</button></div>
      <div id="itemsList"></div></div>
    <div id="settings"></div>
    <div class="panel"><h3>4 · Video script <span class="muted">(optional — you can also add these during the game)</span></h3>
      <div class="scriptBox"></div></div>`;
  renderSettings(g); renderItemsList(g); refreshScript();
}

function renderSettings(g) {
  const el = document.getElementById('settings');
  if (g.mode === 'rank') {
    el.innerHTML = `<div class="panel"><h3>Ranking options</h3><div class="field">
      <label>Rank only the top… (leave blank to rank every item, e.g. 10 of 25)</label>
      <input type="number" min="1" data-in="topN" style="max-width:160px" placeholder="All" value="${g.topN || ''}"></div></div>`;
  } else if (g.mode === 'tier') {
    el.innerHTML = `<div class="panel"><h3>Tiers</h3>
      ${g.tiers.map(t => `<div class="tier-edit">
        <input type="color" data-in="tiercolor" data-id="${t.id}" value="${t.color}">
        <input type="text" data-in="tiername" data-id="${t.id}" value="${esc(t.name)}">
        <button class="ghost danger" data-act="delTier" data-id="${t.id}" ${g.tiers.length < 2 ? 'disabled' : ''}>✕</button></div>`).join('')}
      <button class="ghost" data-act="addTier">+ Add tier</button></div>`;
  } else if (g.mode === 'rated') {
    el.innerHTML = `<div class="panel"><h3>How it works</h3><div class="muted">
      Items appear one at a time in random order. Your client picks <b>Overrated</b> or <b>Underrated</b> for each, then sees both lists.</div></div>`;
  } else {
    el.innerHTML = `<div class="panel"><h3>How it works</h3><div class="muted">
      Your client picks a winner between two items at a time. Items are placed smartly (binary insertion), so
      ${g.items.length > 1 ? `about <b>${estimateComparisons(g.items.length)}</b> choices` : 'a handful of choices'} produce a full ranking.</div></div>`;
  }
}
function estimateComparisons(n) { let t = 0; for (let k = 1; k < n; k++) t += Math.ceil(Math.log2(k + 1)); return t; }

function renderItemsList(g) {
  document.getElementById('itemCount').textContent = `(${g.items.length})`;
  document.getElementById('itemsList').innerHTML = g.items.length ? g.items.map((it, i) => `
    <div class="items-row"><span class="n">${i + 1}</span>
      <input type="text" data-in="item" data-id="${it.id}" value="${esc(it.text)}">
      <button class="ghost danger" data-act="delItem" data-id="${it.id}">✕</button></div>`).join('')
    : '<div class="muted">No items yet. Add at least 2 to start.</div>';
  const b = document.getElementById('startBtn'); if (b) b.disabled = g.items.length < 2;
  if (g.mode === 'versus') renderSettings(g);
}

function resetProgress(g) { g.session = null; g.result = null; }

function addItems(g) {
  const ta = document.getElementById('newItems');
  const lines = ta.value.split('\n').map(s => s.replace(/^\s*(?:[-*•]|\d+[.)])\s+/, '').trim()).filter(Boolean);
  if (!lines.length) return;
  lines.forEach(text => g.items.push({ id: uid(), text }));
  resetProgress(g); touch(g); ta.value = ''; renderItemsList(g); ta.focus();
}

/* ---------- sessions ---------- */
function startSession(g) {
  const ids = g.items.map(i => i.id);
  g.result = null;
  if (g.mode === 'rank') {
    const n = Math.max(1, Math.min(g.topN || ids.length, ids.length));
    g.session = { slots: Array(n).fill(null) };
  } else if (g.mode === 'tier') {
    g.session = { tiers: Object.fromEntries(g.tiers.map(t => [t.id, []])) };
  } else if (g.mode === 'rated') {
    g.session = { order: shuffle(ids), idx: 0, answers: {} };
  } else {
    const order = shuffle(ids);
    g.session = { order, sorted: [order[0]], idx: 1, lo: 0, hi: 1, flip: Math.random() < .5, history: [] };
  }
  touch(g);
}

/* ---------- play ---------- */
function renderPlay(g) {
  view = 'play';
  const head = (sub) => `<div class="topbar">
    <button class="ghost" data-act="home">← Save &amp; exit</button>
    <div class="grow"><h2>${esc(nameOf(g))}</h2><div class="hint">${sub}</div></div>
    <button data-act="toggleScript">✍️ Script</button>
    <button class="ghost" data-act="restart">Restart</button></div>`;
  if (g.mode === 'versus') return renderVersus(g, head);
  if (g.mode === 'rated') return renderRated(g, head);
  const s = g.session;
  const placed = g.mode === 'rank' ? new Set(s.slots.filter(Boolean)) : new Set(Object.values(s.tiers).flat());
  const poolItems = g.items.filter(i => !placed.has(i.id));
  const chip = id => `<div class="chip ${sel === id ? 'sel' : ''}" draggable="true" data-item="${id}">${esc(itemById(g, id).text)}</div>`;
  const hint = 'Drag items into place — or tap an item, then tap where it goes.';

  if (g.mode === 'rank') {
    const filled = s.slots.filter(Boolean).length;
    $app.innerHTML = head(hint) + `
      <div class="rank-layout">
        <div><div class="muted" style="margin-bottom:8px">Items (${poolItems.length} left)</div>
          <div class="pool col" data-drop="pool">${poolItems.map(i => chip(i.id)).join('') || '<span class="hint">All placed 🎉</span>'}</div></div>
        <div><div class="muted" style="margin-bottom:8px">Your ranking (${filled}/${s.slots.length})</div>
          <div class="slots">${s.slots.map((id, i) => `
            <div class="slot ${id ? 'filled' : ''}" data-drop="slot" data-i="${i}"><div class="num">${i + 1}</div>
              ${id ? chip(id) : '<span class="ph">Drop here</span>'}</div>`).join('')}</div></div>
      </div>
      <div class="finish"><button class="primary big" data-act="finish" ${filled < s.slots.length ? 'disabled' : ''}>See final ranking →</button></div>`;
  } else {
    const placedCount = placed.size;
    $app.innerHTML = head(hint) + `
      <div class="tiers">${g.tiers.map(t => `
        <div class="tier"><div class="tier-label" style="background:${t.color}">${esc(t.name)}</div>
          <div class="tier-items" data-drop="tier" data-tier="${t.id}">${s.tiers[t.id].map(chip).join('')}</div></div>`).join('')}</div>
      <div class="muted" style="margin-bottom:8px">Items (${poolItems.length} left)</div>
      <div class="pool" data-drop="pool">${poolItems.map(i => chip(i.id)).join('') || '<span class="hint">All placed 🎉</span>'}</div>
      <div class="finish"><button class="primary big" data-act="finish" ${placedCount === 0 ? 'disabled' : ''}>See final tier list →</button></div>`;
  }
}

function removeFromAll(g, id) {
  const s = g.session;
  if (g.mode === 'rank') { const i = s.slots.indexOf(id); if (i > -1) { s.slots[i] = null; return { slot: i }; } }
  else for (const t in s.tiers) { const i = s.tiers[t].indexOf(id); if (i > -1) { s.tiers[t].splice(i, 1); return { tier: t }; } }
  return {};
}

function dropItem(id, target) {
  const g = cur(); if (!g || !g.session || !id) return;
  const s = g.session;
  if (target.type === 'tier' && target.before === id) return;
  const from = removeFromAll(g, id);
  if (g.mode === 'rank' && target.type === 'slot') {
    const occ = s.slots[target.i];
    s.slots[target.i] = id;
    if (occ && from.slot !== undefined) s.slots[from.slot] = occ;
  } else if (g.mode === 'tier' && target.type === 'tier') {
    const arr = s.tiers[target.tier];
    const at = target.before ? arr.indexOf(target.before) : -1;
    if (at > -1) arr.splice(at, 0, id); else arr.push(id);
  }
  sel = null; touch(g); renderPlay(g);
}

function targetOf(zone, chip) {
  const t = zone.dataset.drop;
  if (t === 'slot') return { type: 'slot', i: +zone.dataset.i };
  if (t === 'tier') return { type: 'tier', tier: zone.dataset.tier, before: chip && zone.contains(chip) ? chip.dataset.item : null };
  return { type: 'pool' };
}

/* ---------- versus ---------- */
function renderVersus(g, head) {
  const s = g.session, n = g.items.length;
  const curId_ = s.order[s.idx], mid = Math.floor((s.lo + s.hi) / 2);
  const c = itemById(g, curId_), o = itemById(g, s.sorted[mid]);
  const [a, b] = s.flip ? [o, c] : [c, o];
  const pct = Math.round((s.idx - 1) / (n - 1) * 100);
  $app.innerHTML = head('Pick the one you prefer. Shortcuts: ← / → to choose, Z to undo.') + `
    <div class="center muted">Item ${s.idx} of ${n} being placed · ${pct}% done</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="vs">
      <button class="vs-card" data-act="pick" data-id="${a.id}">${esc(a.text)}</button>
      <div class="vs-or">OR</div>
      <button class="vs-card" data-act="pick" data-id="${b.id}">${esc(b.text)}</button>
    </div>
    <div class="finish" style="justify-content:center"><button class="ghost" data-act="undo" ${s.history.length ? '' : 'disabled'}>↶ Undo last pick</button></div>`;
}

function renderRated(g, head) {
  const s = g.session, n = s.order.length, pct = Math.round(s.idx / n * 100);
  $app.innerHTML = head('Overrated or underrated? Shortcuts: ← overrated, → underrated, Z to go back.') + `
    <div class="center muted">Item ${s.idx + 1} of ${n}</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="rate-item">${esc(itemById(g, s.order[s.idx]).text)}</div>
    <div class="rate-btns">
      <button class="over" data-act="rate" data-v="over">📉 Overrated</button>
      <button class="under" data-act="rate" data-v="under">📈 Underrated</button></div>
    <div class="finish" style="justify-content:center"><button class="ghost" data-act="unrate" ${s.idx ? '' : 'disabled'}>↶ Back</button></div>`;
}
function rate(v) {
  const g = cur(), s = g.session;
  s.answers[s.order[s.idx]] = v; s.idx++;
  if (s.idx >= s.order.length) return finish();
  touch(g); renderPlay(g);
}
function unrate() {
  const g = cur(), s = g.session;
  if (!s.idx) return;
  s.idx--; delete s.answers[s.order[s.idx]]; touch(g); renderPlay(g);
}

function pick(winnerId) {
  const g = cur(), s = g.session;
  s.history.push({ sorted: s.sorted.slice(), idx: s.idx, lo: s.lo, hi: s.hi, flip: s.flip });
  const curItem = s.order[s.idx], mid = Math.floor((s.lo + s.hi) / 2);
  if (winnerId === curItem) s.hi = mid; else s.lo = mid + 1;
  if (s.lo >= s.hi) {
    s.sorted.splice(s.lo, 0, curItem);
    s.idx++; s.lo = 0; s.hi = s.sorted.length;
  }
  s.flip = Math.random() < .5;
  if (s.idx >= s.order.length) return finish();
  touch(g); renderPlay(g);
}
function undo() {
  const g = cur(), s = g.session;
  if (!s.history.length) return;
  Object.assign(s, s.history.pop()); touch(g); renderPlay(g);
}

/* ---------- finish & results ---------- */
function finish() {
  const g = cur(), s = g.session, tx = id => itemById(g, id).text;
  if (g.mode === 'rank') {
    const ranked = s.slots.filter(Boolean).map(tx);
    g.result = { type: 'rank', ranked, unranked: g.items.filter(i => !s.slots.includes(i.id)).map(i => i.text) };
  } else if (g.mode === 'tier') {
    const placed = new Set(Object.values(s.tiers).flat());
    g.result = { type: 'tier', tiers: g.tiers.map(t => ({ name: t.name, color: t.color, items: s.tiers[t.id].map(tx) })),
      unranked: g.items.filter(i => !placed.has(i.id)).map(i => i.text) };
  } else if (g.mode === 'rated') {
    g.result = { type: 'rated', over: s.order.filter(id => s.answers[id] === 'over').map(tx), under: s.order.filter(id => s.answers[id] === 'under').map(tx) };
  } else {
    g.result = { type: 'rank', ranked: s.sorted.map(tx), unranked: [] };
  }
  touch(g); go('#/results/' + g.id);
}

function renderResults(g) {
  view = 'results';
  const r = g.result;
  let body;
  if (r.type === 'rank') {
    body = `<div class="podium">${r.ranked.map((t, i) => `<div class="res ${i < 3 ? 'r' + (i + 1) : ''}"><div class="n">${i < 3 ? ['🥇','🥈','🥉'][i] : i + 1}</div>${esc(t)}</div>`).join('')}
      ${r.unranked.map(t => `<div class="res un"><div class="n">–</div>${esc(t)}</div>`).join('')}</div>`;
  } else if (r.type === 'rated') {
    body = `<div class="col2"><div class="over"><h3>📉 Overrated (${r.over.length})</h3>${r.over.map(t => `<div class="chip">${esc(t)}</div>`).join('') || '<div class="hint">None</div>'}</div>
      <div class="under"><h3>📈 Underrated (${r.under.length})</h3>${r.under.map(t => `<div class="chip">${esc(t)}</div>`).join('') || '<div class="hint">None</div>'}</div></div>`;
  } else {
    body = `<div class="tiers">${r.tiers.map(t => `<div class="tier"><div class="tier-label" style="background:${t.color}">${esc(t.name)}</div>
      <div class="tier-items">${t.items.map(i => `<div class="chip">${esc(i)}</div>`).join('')}</div></div>`).join('')}
      ${r.unranked.length ? `<div class="tier"><div class="tier-label" style="background:#555;color:#fff;font-size:14px">Unplaced</div>
      <div class="tier-items">${r.unranked.map(i => `<div class="chip">${esc(i)}</div>`).join('')}</div></div>` : ''}</div>`;
  }
  $app.innerHTML = `<div class="topbar"><button class="ghost" data-act="home">← All games</button>
    <div class="grow center"><span class="badge">${MODES[g.mode].icon} ${MODES[g.mode].label}</span>
    <h1 style="margin-top:6px">🏆 ${esc(nameOf(g))}</h1></div><button data-act="toggleScript">✍️ Script</button></div>
    ${scriptResultHTML(g, 'hooks', '🎣 Hook options')}
    ${body}
    <div style="height:18px"></div>
    ${scriptResultHTML(g, 'closings', '🎬 Closing line options')}
    <div class="actions" style="justify-content:center">
      <button class="primary" data-act="copy">Copy as text</button>
      ${g.mode === 'rank' || g.mode === 'tier' ? '<button data-act="adjust">Adjust</button>' : ''}
      <button data-act="replay" data-id="${g.id}">Play again</button>
      <button class="ghost" data-act="open-edit" data-id="${g.id}">Edit game</button></div>`;
}

function resultText(g) {
  const r = g.result, lines = [nameOf(g), ''];
  const scr = (kind, label) => { const p = g[kind].filter(x => x.pick), l = p.length ? p : g[kind];
    if (!l.length) return; lines.push(p.length ? `${label}:` : `${label} options:`); l.forEach(x => lines.push(`- ${x.text}`)); lines.push(''); };
  scr('hooks', 'Hook');
  if (r.type === 'rated') { lines.push('Overrated:'); r.over.forEach(t => lines.push(`- ${t}`)); lines.push('', 'Underrated:'); r.under.forEach(t => lines.push(`- ${t}`)); }
  else if (r.type === 'rank') { r.ranked.forEach((t, i) => lines.push(`${i + 1}. ${t}`)); }
  else { r.tiers.forEach(t => lines.push(`${t.name}: ${t.items.join(', ') || '—'}`)); if (r.unranked.length) lines.push(`Unplaced: ${r.unranked.join(', ')}`); }
  lines.push(''); scr('closings', 'Closing line');
  return lines.join('\n').trim();
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  const g = cur();
  if (!a) {
    if (view !== 'play' || !g || g.mode === 'versus') return;
    const chip = e.target.closest('[data-item]'), zone = e.target.closest('[data-drop]');
    if (sel && zone && !(chip && zone.dataset.drop === 'pool' && chip.dataset.item !== sel)) {
      if (!(chip && chip.dataset.item === sel)) return dropItem(sel, targetOf(zone, chip));
    }
    if (chip) { sel = sel === chip.dataset.item ? null : chip.dataset.item; renderPlay(g); }
    else if (sel) { sel = null; renderPlay(g); }
    return;
  }
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'new': { const n = { id: uid(), name: '', mode: 'rank', items: [], topN: null, tiers: mkTiers(), hooks: [], closings: [], session: null, result: null, createdAt: Date.now(), updatedAt: Date.now() };
      games.push(n); save(); go('#/edit/' + n.id); break; }
    case 'home': go('#/'); break;
    case 'open-edit': go('#/edit/' + id); break;
    case 'open-play': go('#/play/' + id); break;
    case 'open-results': go('#/results/' + id); break;
    case 'replay': { const t = games.find(x => x.id === id); startSession(t); go('#/play/' + id); break; }
    case 'dup': { const t = games.find(x => x.id === id);
      const c = JSON.parse(JSON.stringify(t)); c.id = uid(); c.name = nameOf(t) + ' (copy)'; c.session = null; c.result = null; c.createdAt = c.updatedAt = Date.now();
      games.push(c); save(); renderHome(); toast('Duplicated'); break; }
    case 'del': { const t = games.find(x => x.id === id);
      if (confirm(`Delete "${nameOf(t)}"? This can't be undone.`)) { games = games.filter(x => x !== t); save(); renderHome(); } break; }
    case 'export': { const b = new Blob([JSON.stringify(games, null, 2)], { type: 'application/json' });
      const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = 'gamified-scripts-backup.json'; l.click(); break; }
    case 'import': document.getElementById('importFile').click(); break;
    // editor
    case 'setMode': if (g.mode !== a.dataset.mode) { g.mode = a.dataset.mode; resetProgress(g); touch(g); renderEditor(g); } break;
    case 'addItems': addItems(g); break;
    case 'delItem': g.items = g.items.filter(i => i.id !== id); resetProgress(g); touch(g); renderItemsList(g); break;
    case 'addTier': g.tiers.push({ id: uid(), name: 'New', color: '#c4b5fd' }); resetProgress(g); touch(g); renderSettings(g); break;
    case 'delTier': g.tiers = g.tiers.filter(t => t.id !== id); resetProgress(g); touch(g); renderSettings(g); break;
    case 'start': if (g.items.length >= 2) { g.items = g.items.filter(i => i.text.trim()); startSession(g); go('#/play/' + g.id); } break;
    // play
    case 'pick': pick(id); break;
    case 'undo': undo(); break;
    case 'rate': rate(a.dataset.v); break;
    case 'unrate': unrate(); break;
    case 'restart': if (confirm('Restart this game from the beginning?')) { startSession(g); renderPlay(g); } break;
    case 'finish': {
      if (g.mode === 'tier') {
        const left = g.items.length - Object.values(g.session.tiers).flat().length;
        if (left && !confirm(`${left} item${left > 1 ? 's are' : ' is'} still unplaced. Finish anyway?`)) break;
      }
      finish(); break; }
    // results
    case 'toggleScript': scriptOpen = !scriptOpen; syncDrawer(); break;
    case 'addScript': addScript(a.dataset.kind); break;
    case 'delScript': g[a.dataset.kind] = g[a.dataset.kind].filter(x => x.id !== id); touch(g); refreshScript(); if (view === 'results') renderResults(g); break;
    case 'starScript': { const list = g[a.dataset.kind], it = list.find(x => x.id === id), was = it.pick;
      list.forEach(x => x.pick = false); it.pick = !was; touch(g); refreshScript(); if (view === 'results') renderResults(g); break; }
    case 'copy': navigator.clipboard.writeText(resultText(g)).then(() => toast('Copied to clipboard'), () => toast('Copy failed')); break;
    case 'adjust': go('#/play/' + g.id); break;
  }
});

document.addEventListener('input', e => {
  const k = e.target.dataset.in, g = cur();
  if (!k || !g) return;
  const v = e.target.value, id = e.target.dataset.id;
  if (k === 'name') g.name = v;
  else if (k === 'script') { const it = (g[e.target.dataset.kind] || []).find(x => x.id === id); if (it) it.text = v; }
  else if (k === 'topN') g.topN = Math.max(1, parseInt(v, 10)) || null;
  else if (k === 'item') { const it = g.items.find(i => i.id === id); if (it) it.text = v; }
  else if (k === 'tiername') g.tiers.find(t => t.id === id).name = v;
  else if (k === 'tiercolor') g.tiers.find(t => t.id === id).color = v;
  touch(g);
});

document.addEventListener('keydown', e => {
  if (e.target.id === 'newItems' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addItems(cur()); return; }
  if (e.target.classList && e.target.classList.contains('addScript') && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addScript(e.target.dataset.kind); return; }
  const g = cur();
  if (view === 'play' && g && g.mode === 'rated' && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
    if (e.key === 'ArrowLeft') rate('over'); else if (e.key === 'ArrowRight') rate('under'); else if (e.key.toLowerCase() === 'z') unrate();
  }
  if (view === 'play' && g && g.mode === 'versus' && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
    const cards = document.querySelectorAll('.vs-card');
    if (e.key === 'ArrowLeft' && cards[0]) pick(cards[0].dataset.id);
    else if (e.key === 'ArrowRight' && cards[1]) pick(cards[1].dataset.id);
    else if (e.key.toLowerCase() === 'z') undo();
  }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const data = JSON.parse(r.result);
      if (!Array.isArray(data)) throw 0;
      data.forEach(x => { if (x && x.items && x.mode) { x.id = uid(); games.push(x); } });
      save(); renderHome(); toast('Imported');
    } catch (err) { toast('That file is not a valid backup'); }
  };
  r.readAsText(e.target.files[0]);
});

/* drag & drop */
document.addEventListener('dragstart', e => {
  const c = e.target.closest && e.target.closest('[data-item]'); if (!c) return;
  dragId = c.dataset.item; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => c.classList.add('dragging'));
});
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (z && dragId) { e.preventDefault(); z.classList.add('over'); }
});
document.addEventListener('dragleave', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (z && !z.contains(e.relatedTarget)) z.classList.remove('over');
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  if (!z || !dragId) return;
  e.preventDefault();
  const id = dragId; dragId = null;
  dropItem(id, targetOf(z, e.target.closest('[data-item]')));
});
document.addEventListener('dragend', () => {
  dragId = null;
  document.querySelectorAll('.over,.dragging').forEach(el => el.classList.remove('over', 'dragging'));
});

route();
</script>
</body>
</html>
